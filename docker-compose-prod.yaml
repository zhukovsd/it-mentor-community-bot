services:
  bot:
    image: zhukovsd/it-mentor-community-bot:main
    env_file: .env.prod
    restart: always
    depends_on:
      - database

  database:
    image: postgres
    env_file: .env.prod
    restart: always

  caddy:
    image: caddy
    env_file: .env.prod
    restart: unless-stopped
    ports:
      - "${METRICS_PORT}:${METRICS_PORT}"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
